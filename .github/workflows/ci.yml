name: ci

on:
  push:
    branches: [main, design]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The CLAUDE.md rules, enforced. Warn-only locally so it never blocks a
      # prototype; strict here, so nothing reaches main with findings.
      - run: npm run validate -- --strict
      - run: npm run build
      - run: npm run build-storybook
